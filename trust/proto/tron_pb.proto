syntax = "proto3";

package tron_pb;

message Player {
  int32 idx = 1;
  bool can_move = 2;
}

message GameState {
  int32 num_rows = 1;
  int32 num_cols = 2;
  bytes board = 3;
  repeated Player players = 4;
}

message Game {
  repeated GameState game_states = 1;
}

message Games {
  repeated Game games = 1;
}
